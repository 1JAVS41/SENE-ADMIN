name: Build SENE ADMIN test APK
# CI validates the Android project scaffold and the official SENE logo resource.

on:
  push:
    branches:
      - integration/ack-universal
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-test-apk.yml"
  workflow_dispatch:

concurrency:
  group: sene-admin-test-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Instalar Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Compilar SENE ADMIN
        run: gradle --no-daemon assembleDebug
      - name: Localizar APK para prueba de arranque
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find "$GITHUB_WORKSPACE/build/outputs/apk" -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK_PATH" && test -s "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Verificar identidad y logotipo
        run: |
          APK="$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -F "name='com.sene.admin'" <<< "$BADGING"
          grep -F "application-label:'SENE ADMIN'" <<< "$BADGING"
          unzip -l "$APK" | grep -q 'logo_sene_pv'
      - name: Smoke test de arranque en emulador Android 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-snapshot-save
          script: |
            set -eu
            test -n "$APK_PATH" && test -s "$APK_PATH"
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb devices -l
            adb install -r "$APK_PATH"
            adb shell am force-stop com.sene.admin
            adb shell am start -W -n com.sene.admin/.MainActivity
            sleep 3
            adb shell pidof com.sene.admin

      - name: Preparar nombre de entrega
        run: |
          mkdir -p dist
          APK="$(find build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK" && test -s "$APK"
          cp "$APK" "dist/SENE ADMIN-online.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SENE ADMIN-online
          path: dist/SENE ADMIN-online.apk
          if-no-files-found: error
          retention-days: 14
