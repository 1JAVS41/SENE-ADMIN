name: Build SENE ADMIN testing APK

on:
  push:
    branches:
      - testing/android-login-password-recovery
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug testing APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: SENE-ADMIN-testing-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
